version: '3.8'

services:
  # 1. Relational Database (Shared for Bioprocess Data & Airflow Metadata)
  postgres:
    image: postgres:15-alpine
    container_name: digest_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: data_engineer
      POSTGRES_PASSWORD: biostream_dev_pw
      POSTGRES_DB: biostream_db
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - digest_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_engineer -d biostream_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Vector Database for Scientific Paper Context
  qdrant:
    image: qdrant/qdrant:latest
    container_name: digest_qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - digest_network

  # 3. Object Storage (Data Lake simulation)
  minio:
    image: minio/minio:latest
    container_name: digest_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: adminpassword
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"
    networks:
      - digest_network

  # 4. Apache Airflow Webserver & Scheduler (Combined for lightweight Codespaces deployment)
  airflow:
    image: apache/airflow:2.8.1-python3.10
    container_name: digest_airflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://data_engineer:biostream_dev_pw@postgres:5432/biostream_db
      - AIRFLOW__CORE__FERNET_KEY=46dxvaZ7FB96N7v_YkP468_S_SXY-4_L2-wQQvOAgAg=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=True
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=adminpassword
      # BioStreamer pipeline configuration (service names, not localhost)
      - BIOSTREAM_PROJECT_ROOT=/opt/airflow/biostreamer
      - PYTHONPATH=/opt/airflow/biostreamer
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=data_engineer
      - POSTGRES_PASSWORD=biostream_dev_pw
      - POSTGRES_DB=biostream_db
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=adminpassword
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      # Mount the repo so DAGs can import src.pipelines.*
      - .:/opt/airflow/biostreamer
      # Persist installed Python packages across container recreation --
      # otherwise the pip install below (torch + Track 2 deps) reruns and
      # re-downloads on every restart.
      - airflow_site_packages:/home/airflow/.local
    ports:
      - "8080:8080"
    # Sequential startup. A single backgrounded '&&' chain races the webserver
    # against the migration, so the webserver comes up against an un-migrated
    # database and exits. Each step below completes before the next begins;
    # only the scheduler is backgrounded, and the webserver takes PID 1 via exec
    # so container stop signals reach it.
    #
    # Track 2 dependencies are installed here rather than via
    # _PIP_ADDITIONAL_REQUIREMENTS (which the base image's own entrypoint
    # comment marks "NEVER use in production" and which resolves everything in
    # one unscoped `pip install`). torch is installed first, from its own
    # CPU-only index -- the default PyPI resolution otherwise pulls the CUDA
    # build, several GB of nvidia-* packages this container never uses, which
    # is what exhausted local disk on first attempt. Installing it up front
    # means sentence-transformers' own torch dependency is already satisfied
    # and pip does not re-resolve a GPU build for it afterward.
    command:
      - bash
      - -c
      - |
        pip install --no-cache-dir --quiet \
          torch --index-url https://download.pytorch.org/whl/cpu
        pip install --no-cache-dir --quiet \
          pandas pyarrow psycopg2-binary minio \
          qdrant-client langchain-text-splitters sentence-transformers
        airflow db migrate
        airflow users create \
          --username admin --password adminpassword \
          --firstname Bio --lastname Dev --role Admin \
          --email admin@biostream.com || true
        airflow scheduler &
        exec airflow webserver
    networks:
      - digest_network

networks:
  digest_network:
    driver: bridge

volumes:
  airflow_site_packages:
